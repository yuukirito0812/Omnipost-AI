name: OmniPost scheduled publishing
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Invoke secured scheduler
        env:
          OMNIPOST_URL: ${{ secrets.OMNIPOST_URL }}
          OMNIPOST_CRON_SECRET: ${{ secrets.OMNIPOST_CRON_SECRET }}
        run: |
          test -n "$OMNIPOST_URL" && test -n "$OMNIPOST_CRON_SECRET"
          curl --fail --show-error --silent --max-time 60 \
            --header "Authorization: Bearer $OMNIPOST_CRON_SECRET" \
            "$OMNIPOST_URL/api/cron/publish"
